
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "abc-sales"
version = "0.1.0"
description = "Databricks PySpark medallion pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<4",
    "pytest>=8",
]

[project.scripts]
abc-sales-run = "abc_sales.main:main"

[tool.setuptools.packages.find]
where = ["src"]
